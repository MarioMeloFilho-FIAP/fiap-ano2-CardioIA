; =============================================================================
; CardioIA – Fase 3 – Monitoramento IoT
; PlatformIO Project Configuration
; =============================================================================

[platformio]
src_dir = src
default_envs = esp32dev

; -----------------------------------------------------------------------------
; Ambiente de produção: ESP32 DevKit V1 (Wokwi / hardware real)
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Bibliotecas externas (R8: MQTT, R1: DHT22, R3: JSON)
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

; Flags de compilação
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCARDIOIA_FASE=3
    -std=gnu++17

; C++17 para std::optional, std::string, etc.
build_unflags = -std=gnu++11

; -----------------------------------------------------------------------------
; Ambiente nativo: testes unitários C++ (Unity) sem Arduino
; Compila apenas os módulos de lógica pura (sem dependência de Arduino.h)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -DCARDIOIA_FASE=3
    -Wall
    -Wextra

; Exclui arquivos que dependem de Arduino.h no build nativo
; (main.cpp usa Serial, WiFiClientSecure, etc.)
build_src_filter =
    +<*>
    -<main.cpp>

test_framework = unity
